services:
  - type: web
    name: lucky-defense
    runtime: node
    plan: free
    buildCommand: npm install --package-lock=false --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lucky-defense-db
          property: connectionString

databases:
  - name: lucky-defense-db
    plan: 0.1c-256mb
